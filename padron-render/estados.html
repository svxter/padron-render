<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienes por estado</title>
<link rel="stylesheet" href="css/ficha.css">
<link rel="stylesheet" href="css/estados.css">
</head>
<body>
<div class="barra">
  <a href="menu.html">← Menú</a>
  <strong>Bienes por estado</strong>
</div>

<div class="contenido">
  <div class="tabs" id="tabs"></div>

  <div class="herramientas">
    <input type="text" id="buscar" placeholder="Buscar número de inventario" autocomplete="off">
    <span id="info"></span>
  </div>

  <div class="seleccion">
    <button id="btnSelTodos">Seleccionar todos de este apartado</button>
    <button id="btnQuitar" class="sec">Quitar selección</button>
    <button id="btnPDF" class="pdf">Descargar PDF (0)</button>
    <span id="progreso"></span>
  </div>

  <table class="lista">
    <thead><tr>
      <th class="col-sel"><input type="checkbox" id="selPagina" title="Seleccionar esta página"></th>
      <th>Número de inventario</th><th>Estado</th><th></th>
    </tr></thead>
    <tbody id="filas"></tbody>
  </table>

  <div class="paginas">
    <button id="ant">← Anterior</button>
    <span id="pag"></span>
    <button id="sig">Siguiente →</button>
  </div>
</div>

<!-- Zona oculta donde se dibuja cada ficha antes de pasarla al PDF -->
<div id="render" style="position:fixed;left:-20000px;top:0;width:1100px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/sesion.js"></script>
<script src="js/estados.js"></script>
</body>
</html>
